patchedDependencies:
  # Node.js >= 24 removed the deprecated `http_parser` binding, which makes
  # http-deceiver (a dependency of spdy, used by @umijs/bundler-utils) throw
  # `No such module: http_parser` while umi registers its plugins.
  # https://github.com/umijs/umi/issues
  'http-deceiver@1.2.7': patches/http-deceiver@1.2.7.patch

