  - packages/hooks
  - packages/utils
  - packages/i18n
  - packages/design
  - packages/ui
  - packages/validators
  - packages/db
  - services/server
  - tasks/jobs/apple-guide-spider
  - tooling/eslint-config
  - tooling/github-config
  - tooling/prettier-config
  - tooling/tailwind-config
  - tooling/typescript-config
nohoist:
